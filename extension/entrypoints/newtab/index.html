<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <h1 class="brand">Visual Memory</h1>
        <span class="count" data-testid="count"></span>
        <span class="sync-status" data-testid="sync-status" aria-live="polite" hidden></span>
        <div class="topbar-actions">
          <button type="button" class="button import-trigger" data-testid="import-trigger">
            Import open tabs
          </button>
          <button type="button" class="button export-trigger" data-testid="export-trigger">
            Export
          </button>
          <button
            type="button"
            class="button account-trigger"
            data-testid="account-trigger"
            hidden
          ></button>
        </div>
      </header>
      <div class="search">
        <input
          type="search"
          class="search-input"
          data-testid="search"
          placeholder="Describe what you remember… (press / to search)"
          aria-label="Search your saves"
          autocomplete="off"
          spellcheck="false"
          autofocus
        />
        <span class="search-status" data-testid="search-status" aria-live="polite"></span>
      </div>
      <section class="account" data-testid="account" hidden></section>
      <section class="import" data-testid="import" aria-live="polite" hidden></section>
      <p class="empty" data-testid="empty" hidden></p>
      <div class="wall" data-testid="wall"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
