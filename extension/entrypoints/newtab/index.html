<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <h1 class="brand">Visual Memory</h1>
        <span class="count" data-testid="count"></span>
        <button type="button" class="button import-trigger" data-testid="import-trigger">
          Import open tabs
        </button>
      </header>
      <section class="import" data-testid="import" aria-live="polite" hidden></section>
      <p class="empty" data-testid="empty" hidden></p>
      <div class="wall" data-testid="wall"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
