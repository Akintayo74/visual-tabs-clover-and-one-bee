name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter extension exec playwright install --with-deps chromium
      - run: pnpm --filter extension e2e

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Applies every migration (a broken one fails CI) and starts what the extension uses:
      # Postgres, the API, Auth, Storage and the test mailbox.
      - run: >-
          pnpm exec supabase start
          -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
      - run: pnpm --filter extension test:server
      - run: pnpm --filter extension exec playwright install --with-deps chromium
      # Backup and sync against the local stack: sign-in, upload, offline, a second browser.
      - run: pnpm --filter extension e2e:sync
